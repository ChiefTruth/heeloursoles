<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Clarity Compass</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="compass-root"></div>

    <!-- Teaching Layer UI -->
    <div id="stance-label"></div>

    <div id="collapse-label">
        <span id="collapse-glyph"></span>
        <span id="collapse-text"></span>
    </div>

    <div id="gesture-hints">
        <div>Drag to shift stance</div>
        <div>Tap to reveal topology</div>
        <div>Long‑press to enter breath‑sync</div>
    </div>

    <div id="energy-indicator">
        <span id="energy-value">E = 0.00</span>
        <div id="energy-bar"><div id="energy-fill"></div></div>
    </div>

    <div id="breath-sync-badge">BREATH SYNC</div>

    <button id="legend-button">?</button>

    <div id="legend-overlay">
        <div class="legend-item">Basin — Appropriate</div>
        <div class="legend-item">Loop — Avoided</div>
        <div class="legend-item">Cliff — Premature</div>
        <div class="legend-item">Funnel — Forced</div>
    </div>

    <script type="module" src="main.js"></script>

</body>
</html>
